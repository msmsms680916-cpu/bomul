  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
  body{background:#fff}
  #app{position:relative;width:100%;background:#fff;min-height:100%;overflow-x:hidden}
  .page{display:none}
  .page.active{display:block;position:relative}
  .page img.bg{display:block;width:100%;height:auto}
  .ov{position:absolute;border:none;background:rgba(0,0,0,0);padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0.08)}
  .ov:active{background:rgba(0,0,0,0.06)}
  .stub{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  .stub h2{margin:0;font-size:20px;color:#222}
  .stub p{margin:0;color:#888;font-size:14px}
  .stub button{margin-top:12px;padding:12px 28px;border-radius:24px;border:none;background:#0076FB;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .cam-hidden-input{display:none}
  #cam2-preview, #cam4-preview{position:absolute;left:0%;top:47%;width:100%;height:30%;object-fit:cover}
  #zoom-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;align-items:center;justify-content:center}
  #zoom-modal.open{display:flex}
  #zoom-modal img{max-width:94%;max-height:90%;object-fit:contain}
  .ai-part{position:relative}
  .ai-part img.bg{display:block;width:100%;height:auto}
  .ai-bar-fill{position:absolute;left:15%;height:2.3%;border-radius:999px;width:0%}
  .ai-pct{position:absolute;left:86%;width:13%;font-weight:800;font-size:3.2vw;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  #page-ai .ov[disabled]{pointer-events:none}
  #ai-result-btn-wrap{position:relative;transition:opacity 0.3s}
  #ai-result-btn-wrap.dim{opacity:0.45}
  #result-front-photo,#result-back-photo{position:absolute;object-fit:cover;top:20.6%;height:17%}
  #result-front-photo{left:1.5%;width:46.5%}
  #result-back-photo{left:52%;width:45%}

  #toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,0.88);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;opacity:0;transition:opacity 0.25s, transform 0.25s;z-index:1000;pointer-events:none;white-space:nowrap}

  .atoggle{position:absolute;border-radius:999px;cursor:pointer;display:flex;align-items:center;box-sizing:border-box;padding:0 4%;transition:background .15s ease}

  .alabel{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;font-size:2.6vw;pointer-events:none}

  function loadBg(pageEl) {
    if (!pageEl) return;
    const img = pageEl.querySelector('img.bg[data-src]');
    if (img) {
      img.src = img.getAttribute('data-src');
      img.removeAttribute('data-src');
    }
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    let activeEl;
    if (id.indexOf('stub-') === 0) {
      document.getElementById('stub-title').textContent = STUB_TITLES[id] || '준비중입니다';
      activeEl = document.getElementById('page-stub');
    } else {
      activeEl = document.getElementById('page-' + id);
    }
    activeEl.classList.add('active');
    loadBg(activeEl);
    window.scrollTo(0, 0);
  }

  function camShoot(prefix) {
    document.getElementById(prefix + '-shoot-input').click();
  }
  function camPickAlbum(prefix) {
    document.getElementById(prefix + '-album-input').click();
  }
  function camPhotoChosen(input, which) {
    const file = input.files && input.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    if (which === 'back') {
      BACK_PHOTO_URL = url;
      navigate('camera4');
    } else {
      FRONT_PHOTO_URL = url;
      navigate('camera2');
    }
  }

  function camRetake() {
    goBack();
  }

  function camZoomOpen(which) {
    let url;
    if (which === 'front') url = FRONT_PHOTO_URL;
    else if (which === 'back') url = BACK_PHOTO_URL;
    else {
      const active = document.querySelector('.page.active').id;
      url = active === 'page-camera4' ? BACK_PHOTO_URL : FRONT_PHOTO_URL;
    }
    if (!url) return;
    document.getElementById('zoom-modal-img').src = url;
    document.getElementById('zoom-modal').classList.add('open');
  }

  let TOAST_TIMER = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (TOAST_TIMER) clearTimeout(TOAST_TIMER);
    TOAST_TIMER = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function shareResult() {
    const url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('공유 링크가 복사되었습니다');
      }).catch(function () {
        showToast('공유 링크가 복사되었습니다');
      });
    } else {
      showToast('공유 링크가 복사되었습니다');
    }
  }

    const b = document.getElementById('ar-dur-border');
    const f = document.getElementById('ar-dur-fill');
    b.style.left = pos.left + '%';
    b.style.width = pos.width + '%';
    f.style.left = pos.left + '%';
    f.style.width = pos.width + '%';
    f.textContent = labels[n];
  }
  function arSelectDuration(n, label) {
    AR_SELECTED_DUR = n;
    arDurRender(n);
    showToast(label + '으로 선택했습니다');
  }
  function arSubmit() {
    showToast('경매가 등록되었습니다');
    navigate('auction');
  }

  function certZoomOpen(which) {
    document.getElementById('zoom-modal-img').src = which === 'front' ? 'photo1.jpg' : 'photo2.jpg';
    document.getElementById('zoom-modal').classList.add('open');
  }

  const PAY_PHOTOS = ['paypic1.jpg', 'paypic2.jpg', 'paypic3.jpg', 'paypic4.jpg'];
  function paySelectPhoto(n) {
    document.getElementById('pay-main-photo').src = PAY_PHOTOS[n - 1];
  }
  function payZoomOpen() {
    document.getElementById('zoom-modal-img').src = document.getElementById('pay-main-photo').src;
    document.getElementById('zoom-modal').classList.add('open');
  }
  const PAY_CARD_POS = {
    1: { borderLeft: 5.28, borderTop: 51.9, checkLeft: 43.2, checkTop: 52.3 },
    2: { borderLeft: 53.29, borderTop: 51.9, checkLeft: 91.2, checkTop: 52.3 },
    3: { borderLeft: 5.28, borderTop: 62.52, checkLeft: 43.2, checkTop: 62.92 },
    4: { borderLeft: 53.29, borderTop: 62.52, checkLeft: 91.2, checkTop: 62.92 }
  };
  function paySelectMove(n) {
    const pos = PAY_CARD_POS[n];
    const b = document.getElementById('pay-select-border');
    const c = document.getElementById('pay-select-check');
    b.style.left = pos.borderLeft + '%';
    b.style.top = pos.borderTop + '%';
    c.style.left = pos.checkLeft + '%';
    c.style.top = pos.checkTop + '%';
  }
  function paySelect(n, method) {
    SELECTED_PAY_METHOD = method;
    paySelectMove(n);
    showToast(method + '를 선택했습니다');
  }
  function payConfirm() {
    navigate('paydone');
  }
  function inqZoom(url) {
    document.getElementById('zoom-modal-img').src = url;
    document.getElementById('zoom-modal').classList.add('open');
  }
  function logoutConfirm() {
    showToast('로그아웃되었습니다');
    navigate('home');
  }

  const ALARM_DEFAULTS = {1:true, 2:true, 3:false, 4:true, 5:false, 6:true, 7:true};
  const ALARM_LABELS = {1:'감정 완료 알림', 2:'경매 알림', 3:'댓글 알림', 4:'쪽지 알림', 5:'좋아요 알림', 6:'포인트 알림', 7:'공지사항 알림'};
  let alarmState = Object.assign({}, ALARM_DEFAULTS);
  function alarmRender(n) {
    const on = alarmState[n];
    const t = document.getElementById('al-toggle-' + n);
    const l = document.getElementById('al-label-' + n);
    t.classList.toggle('on', on);
    t.classList.toggle('off', !on);
    l.classList.toggle('on', on);
    l.classList.toggle('off', !on);
    l.textContent = on ? 'ON' : 'OFF';
  }
  function alarmToggle(n) {
    alarmState[n] = !alarmState[n];
    alarmRender(n);
    showToast(ALARM_LABELS[n] + '을(를) ' + (alarmState[n] ? '켰습니다' : '껐습니다'));
  }
  function alarmReset() {
    alarmState = Object.assign({}, ALARM_DEFAULTS);
    for (let n = 1; n <= 7; n++) alarmRender(n);
  }

  function navigate(id) {
    if (id === 'home') {
      stack = ['home'];
    } else {
      stack.push(id);
    }
    if (id === 'camera2' && FRONT_PHOTO_URL) {
      document.getElementById('cam2-preview').src = FRONT_PHOTO_URL;
    }
    if (id === 'camera4' && BACK_PHOTO_URL) {
      document.getElementById('cam4-preview').src = BACK_PHOTO_URL;
    }
    if (id === 'result') {
      if (FRONT_PHOTO_URL) document.getElementById('result-front-photo').src = FRONT_PHOTO_URL;
      if (BACK_PHOTO_URL) document.getElementById('result-back-photo').src = BACK_PHOTO_URL;
    }
    if (id === 'item') itemSelectPhoto(1);
    if (id === 'hunterdetail') document.getElementById('hd-main-photo').src = 'hdmain.jpg';
    if (id === 'worlddetail') {
      document.getElementById('wd-main-photo').src = 'wdmain.jpg';
      document.getElementById('wd-photo-counter').textContent = '1/3';
    }
    if (id === 'hunterregister') { HR_SELECTED_CAT = 1; hrSelectMove(1, '동전'); }
    if (id === 'auctionregister') { AR_SELECTED_DUR = 2; arDurRender(2); }
    if (id === 'pay') { paySelectPhoto(1); SELECTED_PAY_METHOD = '신용/체크카드'; paySelectMove(1); }
    if (id === 'notif') alarmReset();
    showPage(id);
    if (id === 'ai') aiStart();
  }

  let AI_TIMER = null;
  function aiStart() {
    if (AI_TIMER) { clearInterval(AI_TIMER); AI_TIMER = null; }
    for (let i = 1; i <= 5; i++) {
      document.getElementById('ai-bar-' + i).style.width = '0%';
      document.getElementById('ai-pct-' + i).textContent = '0%';
    }
    document.getElementById('ai-result-btn-wrap').classList.add('dim');
    document.getElementById('ai-result-btn').setAttribute('disabled', '');
    aiRunStep(1);
  }
  function aiRunStep(i) {
    if (i > 5) {
      document.getElementById('ai-result-btn-wrap').classList.remove('dim');
      document.getElementById('ai-result-btn').removeAttribute('disabled');
      return;
    }
    const bar = document.getElementById('ai-bar-' + i);
    const pct = document.getElementById('ai-pct-' + i);
    let p = 0;
    AI_TIMER = setInterval(function () {
      p += 5;
      if (p >= 100) {
        p = 100;
        clearInterval(AI_TIMER);
        AI_TIMER = null;
      }
      bar.style.width = (p * 0.70 / 100) + '%';
      pct.textContent = p + '%';
      if (p >= 100) {
        setTimeout(function () { aiRunStep(i + 1); }, 150);
      }
    }, 35);
  }

  const WD_PHOTOS = ['wdthumb1.jpg', 'wdthumb2.jpg'];
  function wdSelectPhoto(n) {
    document.getElementById('wd-main-photo').src = WD_PHOTOS[n - 1];
    document.getElementById('wd-photo-counter').textContent = (n + 1) + '/3';
  }
  function wdZoomOpen() {
    document.getElementById('zoom-modal-img').src = document.getElementById('wd-main-photo').src;
    document.getElementById('zoom-modal').classList.add('open');
  }

  function goBack() {
    if (stack.length > 1) stack.pop();
    showPage(stack[stack.length - 1]);
  }

  loadBg(document.querySelector('.page.active'));

  try { history.pushState({ trap: true }, '', location.href); } catch (e) {}
  window.addEventListener('popstate', function () {
    try { history.pushState({ trap: true }, '', location.href); } catch (e) {}
    goBack();
  });
</script>
</body>
</html>
