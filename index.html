<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f8;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;max-width:520px;margin:0 auto;background:#fdfdfe;box-shadow:0 0 24px rgba(0,30,80,.12)}
header,footer{flex:none;position:relative;z-index:10;line-height:0}
header{background:#00337f;padding-top:env(safe-area-inset-top)}
footer{background:#fff;padding-bottom:env(safe-area-inset-bottom)}
img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fdfdfe}
/* 메인: 남은 화면 높이에 맞춰 자동 배치 */
.fit{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.sl{position:relative;line-height:0;width:100%;flex:none}
.wrap{position:relative;line-height:0}
.hit{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:12px;transition:background-color .25s}
.hit:active{background:rgba(0,40,120,.10);transition:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,25,50,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:22px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
