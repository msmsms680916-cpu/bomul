<title>담보코리아</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f8;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;max-width:520px;margin:0 auto;background:#fdfdfe;box-shadow:0 0 24px rgba(0,30,80,.12)}
header,footer{flex:none;position:relative;z-index:10;line-height:0}
header{background:#00337f;padding-top:env(safe-area-inset-top)}
footer{background:#fff;padding-bottom:env(safe-area-inset-bottom);display:flex;border-top:1px solid #e6eaf2}
img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
main{flex:1;min-height:0;position:relative;overflow:hidden;background:#fdfdfe}
.pg{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none}
.pg.on{display:block;animation:pgin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateX(8%)}to{opacity:1;transform:none}}
.fit{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.sl{position:relative;line-height:0;width:100%;flex:none}
.wrap{position:relative;line-height:0}
.hit{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:12px;transition:background-color .25s}
.hit:active{background:rgba(0,40,120,.10);transition:none}
.tab{flex:1;position:relative;border:0;padding:0;background:#fff;cursor:pointer}
.tab img.on{position:absolute;inset:0;opacity:0}
.tab.act img.on{opacity:1}.tab.act img.off{opacity:0}
.tab.act::before{content:'';position:absolute;left:18%;right:18%;top:0;height:3px;border-radius:0 0 3px 3px;background:#1268f5;z-index:2}
.tab:active{background:#f1f4fa}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,25,50,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:22px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style></head>

<script>
var cur=null;
function soon(n){var t=document.getElementById('toast');t.textContent=n+' 메뉴는 준비중입니다';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},1600)}
function fit(){document.querySelectorAll('.pg').forEach(function(p){var w=p.clientWidth||document.querySelector('main').clientWidth,a=document.querySelector('main').clientHeight,n=w*p.dataset.h/p.dataset.w,s=Math.min(1,a/n);p.querySelectorAll('.sl').forEach(function(el){el.style.width=(s*100)+'%'})})}
function show(p){
 if(cur===p){var e=document.getElementById('pg-'+p);e.scrollTo({top:0,behavior:'smooth'});return}
 document.querySelectorAll('.pg').forEach(function(x){x.classList.toggle('on',x.id==='pg-'+p)});
 document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('act',t.dataset.p===p)});
 cur=p;fit();
}
function go(p){if(cur===p){show(p);return}try{history.pushState({p:p},'',location.pathname+location.search)}catch(e){}show(p)}
addEventListener('popstate',function(e){show((e.state&&e.state.p)||'home')});
try{history.replaceState({p:'home'},'',location.pathname+location.search)}catch(e){}
addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,200)});
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
show('home');
</script>
